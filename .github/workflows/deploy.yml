name: Build and Push Images

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image names
        id: image_names
        run: |
          # Convert repository and owner to lowercase for Docker tags
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/$REPO_LOWER-backend:latest" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/$REPO_LOWER-frontend:latest" >> $GITHUB_OUTPUT
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.image_names.outputs.backend }}
          file: ./app/Dockerfile
          context: .
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.image_names.outputs.frontend }}
          file: ./Dockerfile.frontend
          context: .
