name: Build and Push Images

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image names
        id: image_names
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [ -z "$REPO" ]; then
            REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          fi
          OWNER_LOWER=$(echo "$OWNER" | iconv -t ascii//TRANSLIT | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]_.-')
          REPO_LOWER=$(echo "$REPO" | iconv -t ascii//TRANSLIT | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]_.-')
          echo "backend=ghcr.io/$OWNER_LOWER/$REPO_LOWER-backend:latest" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/$OWNER_LOWER/$REPO_LOWER-frontend:latest" >> $GITHUB_OUTPUT
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.image_names.outputs.backend }}
          file: ./app/Dockerfile
          context: .
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.image_names.outputs.frontend }}
          file: ./Dockerfile.frontend
          context: .
